<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Papers — Malgari</title>
    <meta name="description" content="KP Teacher Induction Program past papers — Phase II, III, and IV">
    <meta name="theme-color" content="#0B5D2E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; color: #333; }
        header { background: linear-gradient(135deg, #0B5D2E 0%, #0d7a3b 100%); color: white; padding: 24px 16px; text-align: center; }
        header h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
        header p { font-size: 13px; opacity: 0.95; }
        .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
        .phase-section { margin-bottom: 40px; }
        .phase-title { font-size: 18px; font-weight: 600; color: #0B5D2E; margin: 30px 0 16px 0; border-bottom: 2px solid #0B5D2E; padding-bottom: 8px; }
        .papers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .paper-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .card-header { background: linear-gradient(135deg, #0B5D2E 0%, #0d7a3b 100%); color: white; padding: 16px; }
        .card-header h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .card-meta { font-size: 12px; opacity: 0.9; }
        .card-body { padding: 16px; }
        .card-body p { font-size: 13px; color: #666; margin-bottom: 12px; }
        .buttons-group { display: flex; gap: 8px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-view { background: #f0f0f0; color: #333; border: 1px solid #ddd; }
        .btn-download { background: #0B5D2E; color: white; }
        .coming-soon { background: #f5f5f5; color: #999; padding: 16px; text-align: center; border-radius: 6px; font-size: 13px; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal.open { display: block; }
        .modal-content { background-color: white; width: 100%; height: 100%; display: flex; flex-direction: column; }
        .modal-header { background: #0B5D2E; color: white; padding: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: 600; }
        .close-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 0; }
        .modal-iframe { flex: 1; border: none; }
        @media (max-width: 600px) { .papers-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
    <h1>Past Papers / پرانے پرچے</h1>
    <p>KP Teacher Induction Program — Phase II, III & IV</p>
</header>

<div class="container">
    <div class="phase-section">
        <h2 class="phase-title">Phase II</h2>
        <div class="papers-grid" id="phase2Grid"></div>
    </div>

    <div class="phase-section">
        <h2 class="phase-title">Phase III</h2>
        <div class="papers-grid" id="phase3Grid"></div>
    </div>

    <div class="phase-section">
        <h2 class="phase-title">Phase IV</h2>
        <div class="papers-grid" id="phase4Grid"></div>
    </div>
</div>

<div id="pdfModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span id="modalTitle">PDF Viewer</span>
            <button class="close-btn" onclick="closePDFModal()">×</button>
        </div>
        <iframe id="pdfFrame" class="modal-iframe"></iframe>
    </div>
</div>

<script>
const papers = {
    "Phase II": [
        { subject: "Teaching of Mathematics", marks: "70", sections: "A: 14 MCQs · B: 7 Short Qs · C: 5 Long Qs", pdf: "assets/papers/phase-ii/math-phase-ii.pdf" },
        { subject: "Teaching of English", marks: "70", sections: "A: 14 MCQs · B: 9 Short Qs · C: 4 Long Qs", pdf: "assets/papers/phase-ii/english-phase-ii.pdf" },
        { subject: "General Science", marks: "70", sections: "A: 14 MCQs · B: 7 Short Qs · C: 5 Long Qs", pdf: "assets/papers/phase-ii/science-phase-ii.pdf" },
        { subject: "Islamiyat / Nazra Quran", marks: "70", sections: "A: 15 MCQs · B: 9 Short Qs · C: 6 Long Qs", pdf: "assets/papers/phase-ii/islamiyat-phase-ii.pdf" },
        { subject: "Use of ICT in Education", marks: "100", sections: "A: 20 MCQs · B: 5 Short Qs · C: 4 Long Qs", pdf: "assets/papers/phase-ii/ict-phase-ii.pdf" },
        { subject: "Classroom Management & Assessment", marks: "100", sections: "A: 20 MCQs · B: 8 Short Qs · C: 4 Long Qs", pdf: "assets/papers/phase-ii/classroom-mgmt-phase-ii.pdf" },
        { subject: "Educational Psychology", marks: "100", sections: "A: 20 MCQs · B: 11 Short Qs · C: 6 Long Qs", pdf: "assets/papers/phase-ii/edpsych-phase-ii.pdf" },
        { subject: "Curriculum & Instruction", marks: "100", sections: "A: 20 MCQs · B: 12 Short Qs · C: 6 Long Qs", pdf: "assets/papers/phase-ii/curriculum-phase-ii.pdf" }
    ],
    "Phase III": [
        { subject: "Coming Soon", marks: "—", status: "coming" }
    ],
    "Phase IV": [
        { subject: "Teaching of Mathematics", marks: "70", sections: "A: 14 MCQs · B: 7 Short Qs · C: 5 Long Qs", pdf: "assets/papers/phase-iv/math-phase-iv.pdf" },
        { subject: "Teaching of English", marks: "70", sections: "A: 14 MCQs · B: 9 Short Qs · C: 4 Long Qs", pdf: "assets/papers/phase-iv/english-phase-iv.pdf" },
        { subject: "General Science", marks: "70", sections: "A: 14 MCQs · B: 7 Short Qs · C: 5 Long Qs", pdf: "assets/papers/phase-iv/science-phase-iv.pdf" },
        { subject: "Islamiyat / Nazra Quran", marks: "70", sections: "A: 15 MCQs · B: 9 Short Qs · C: 6 Long Qs", pdf: "assets/papers/phase-iv/islamiyat-phase-iv.pdf" },
        { subject: "Use of ICT in Education", marks: "100", sections: "A: 20 MCQs · B: 5 Short Qs · C: 4 Long Qs", pdf: "assets/papers/phase-iv/ict-phase-iv.pdf" },
        { subject: "Educational Psychology", marks: "100", sections: "A: 20 MCQs · B: 11 Short Qs · C: 6 Long Qs", pdf: "assets/papers/phase-iv/edpsych-phase-iv.pdf" },
        { subject: "Classroom Management & Assessment", marks: "100", sections: "A: 20 MCQs · B: 8 Short Qs · C: 4 Long Qs", pdf: "assets/papers/phase-iv/classroom-mgmt-phase-iv.pdf" },
        { subject: "Curriculum & Instruction", marks: "100", sections: "A: 20 MCQs · B: 12 Short Qs · C: 6 Long Qs", pdf: "assets/papers/phase-iv/curriculum-phase-iv.pdf" }
    ]
};

function createCard(paper) {
    if (paper.status === 'coming') {
        return `<div class="paper-card"><div class="card-header"><h3>${paper.subject}</h3></div><div class="card-body"><div class="coming-soon">Coming Soon</div></div></div>`;
    }
    return `<div class="paper-card"><div class="card-header"><h3>${paper.subject}</h3><div class="card-meta">📄 ${paper.marks} marks · ⏱️ 3 hrs</div></div><div class="card-body"><p>${paper.sections}</p><div class="buttons-group"><button class="btn btn-view" onclick="openPDFModal('${paper.pdf}', '${paper.subject}')">👁️ View</button><a href="${paper.pdf}" download class="btn btn-download">⬇️ Download</a></div></div></div>`;
}

function renderAll() {
    Object.keys(papers).forEach(phase => {
        const gridId = `phase${phase.split(' ')[1]}Grid`;
        const grid = document.getElementById(gridId);
        if (grid) {
            grid.innerHTML = papers[phase].map(paper => createCard(paper)).join('');
        }
    });
}

function openPDFModal(pdfUrl, title) {
    document.getElementById('pdfModal').classList.add('open');
    document.getElementById('pdfFrame').src = pdfUrl;
    document.getElementById('modalTitle').textContent = title;
}

function closePDFModal() {
    document.getElementById('pdfModal').classList.remove('open');
    document.getElementById('pdfFrame').src = '';
}

window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePDFModal(); });

renderAll();
</script>

</body>
</html>
